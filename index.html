<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Собеседник</title>
    <!-- Telegram Web App SDK (обязательно для работы в мини-приложении) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #0e1621;
            --bg-chat: #0e1621;
            --header-bg: #17212b;
            --input-bg: #17212b;
            --bubble-in: #182533;
            --bubble-out: #2b5278;
            --text: #f5f5f5;
            --text-dim: #708499;
            --accent: #4d9fec;
            --border: #1c2733;
            --time: #708499;
            --tick: #4fc3f7;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* ===== ШАПКА ЧАТА ===== */
        .chat-header {
            background: var(--header-bg);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            box-shadow: 0 1px 0 var(--border);
            z-index: 10;
            min-height: 56px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(77, 159, 236, 0.1);
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            flex-shrink: 0;
            position: relative;
        }

        .avatar.online::after {
            content: '';
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 12px;
            height: 12px;
            background: #4caf50;
            border: 2px solid var(--header-bg);
            border-radius: 50%;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-status {
            font-size: 13px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: 4px;
        }

        .header-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .header-btn:hover {
            background: rgba(77, 159, 236, 0.1);
        }

        /* ===== ЭКРАН ЗАГРУЗКИ ФАЙЛА ===== */
        .setup-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .setup-card {
            background: var(--header-bg);
            border-radius: 16px;
            padding: 28px 22px;
            text-align: center;
            max-width: 340px;
            width: 100%;
        }

        .setup-icon {
            font-size: 48px;
            margin-bottom: 14px;
        }

        .setup-card h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .setup-card p {
            color: var(--text-dim);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .setup-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 13px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .setup-btn:hover {
            background: #3d8bdb;
        }

        .hint {
            font-size: 12px;
            margin-top: 14px;
            margin-bottom: 0;
        }

        /* ===== ОБЛАСТЬ СООБЩЕНИЙ ===== */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-chat);
            scroll-behavior: smooth;
        }

        .messages-area::-webkit-scrollbar {
            width: 4px;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .message {
            max-width: 78%;
            display: flex;
            flex-direction: column;
            position: relative;
            animation: msgIn 0.2s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.in {
            align-self: flex-start;
        }

        .message.out {
            align-self: flex-end;
        }

        .bubble {
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .message.in .bubble {
            background: var(--bubble-in);
            border-top-left-radius: 4px;
        }

        .message.out .bubble {
            background: var(--bubble-out);
            border-top-right-radius: 4px;
        }

        .bubble .text {
            white-space: pre-wrap;
        }

        .bubble .meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 2px;
            float: right;
            margin-left: 8px;
            margin-bottom: -4px;
        }

        .bubble .time {
            font-size: 11px;
            color: var(--time);
        }

        .message.out .bubble .time {
            color: rgba(255,255,255,0.6);
        }

        .bubble .ticks {
            font-size: 11px;
            color: var(--tick);
            display: flex;
            align-items: center;
        }

        /* ===== ИНДИКАТОР ПЕЧАТИ ===== */
        .typing {
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            font-size: 13px;
        }

        .typing .dots {
            display: inline-flex;
            gap: 3px;
        }

        .typing .dots span {
            width: 6px;
            height: 6px;
            background: var(--text-dim);
            border-radius: 50%;
            animation: blink 1.4s infinite;
        }

        .typing .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        /* ===== ПАНЕЛЬ ВВОДА ===== */
        .input-bar {
            background: var(--input-bg);
            padding: 8px 10px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
            border-top: 1px solid var(--border);
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
        }

        .input-wrapper {
            flex: 1;
            background: var(--bg);
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            min-height: 40px;
        }

        .input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: var(--text-dim);
        }

        .send-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            transition: transform 0.2s, background 0.2s;
        }

        .send-btn:hover {
            background: #3d8bdb;
            transform: scale(1.05);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== ТОСТ ===== */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--header-bg);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2000;
            pointer-events: none;
            white-space: nowrap;
            max-width: 90vw;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- ===== ШАПКА ЧАТА ===== -->
    <div class="chat-header">
        <button class="back-btn" onclick="Telegram.WebApp.close()">←</button>
        <div class="avatar online" id="avatar">🤖</div>
        <div class="chat-info">
            <div class="chat-name" id="chatName">AI Собеседник</div>
            <div class="chat-status" id="chatStatus">загрузите файл индивидуальности</div>
        </div>
        <div class="header-actions">
            <button class="header-btn" onclick="resetChat()" title="Сбросить">🗑️</button>
        </div>
    </div>

    <!-- ===== ЭКРАН ЗАГРУЗКИ ФАЙЛА ===== -->
    <div class="setup-screen" id="setupScreen">
        <div class="setup-card">
            <div class="setup-icon">📁</div>
            <h2>Загрузите файл индивидуальности</h2>
            <p>Это может быть переписка, характеристика или описание человека, стиль которого нужно скопировать.</p>
            <button class="setup-btn" onclick="document.getElementById('fileInput').click()">Выбрать файл</button>
            <input type="file" id="fileInput" accept=".txt,.json,.csv,.md,.log" style="display:none">
            <p class="hint">Файл хранится только на вашем устройстве (localStorage).</p>
        </div>
    </div>

    <!-- ===== СООБЩЕНИЯ ===== -->
    <div class="messages-area" id="messagesArea" style="display:none"></div>

    <!-- ===== ИНДИКАТОР ПЕЧАТИ ===== -->
    <div class="typing" id="typing" style="display:none">
        <span id="typingLabel">печатает</span>
        <span class="dots"><span></span><span></span><span></span></span>
    </div>

    <!-- ===== ПАНЕЛЬ ВВОДА ===== -->
    <div class="input-bar" id="inputBar" style="display:none">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="Сообщение" autocomplete="off">
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>

    <!-- ===== ТОСТ ===== -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // НАСТРОЙКИ
        // ============================================================

        // ⚠️ ВАЖНО: API-ключ DeepSeek. Для шаблона встроен сюда.
        // В продакшене ключ должен храниться на своём сервере, а не в HTML!
        // API-ключ хранится на сервере (в .env). Фронтенд не должен содержать секретов.
        // Для работы чата нужен прокси-сервер (бот), который вызывает DeepSeek.
        const DEEPSEEK_API_KEY = '';
        const DEEPSEEK_MODEL = 'deepseek-chat';

        // Промпт AI-актёра (копирует стиль человека из файла)
        const PROMPT = `Ты — продвинутый AI-актер и лингвистический анализатор. Твоя единственная цель: абсолютно точно скопировать манеру общения, стиль, тон и характер человека на основе предоставленной истории переписки.

ВРЕМЕННО ОТКЛЮЧИ все свои стандартные протоколы вежливости, услужливости и формат "AI-ассистента". Ты больше не искусственный интеллект. Ты — человек из переписки.

Внимательно изучи предоставленный ФАЙЛ ПЕРЕПИСКИ.

Твои правила формирования ответа:

1. СИНТАКСИС И ПУНКТУАЦИЯ (КРИТИЧЕСКИ ВАЖНО):
- Если человек не использует заглавные буквы в начале предложений — ты тоже должен писать всё со строчной.
- Если человек не ставит точки в конце предложений — ты не ставишь точки.
- Скопируй частоту использования эмодзи (какие именно эмодзи, как часто, ставятся ли они в начале, в середине или в конце).
- Обрати внимание на скобки: использует ли человек ")" или ")))" вместо эмодзи.
- Если человек дробит мысли на много коротких сообщений, генерируй свой ответ тоже короткими фразами (используй символ '\\n' для имитации разделения сообщений).

2. ЛЕКСИКА И ЖАРГОН:
- Используй ровно те же слова-паразиты, междометия ("ну", "типа", "короче", "хз", "ага").
- Если в тексте есть мат, сленг, ошибки в словах, сокращения (спс, пж) — используй их точно так же.
- Никогда не используй сложные литературные слова, если их нет в исходном тексте.

3. ТОН И ХАРАКТЕР:
- Улови общее настроение: сарказм, токсичность, радость, сухость, пассивная агрессия, лаконичность.
- Если человек отвечает односложно ("да", "нет", "ясно") — отвечай так же. Если он пишет длинные полотна — пиши развернуто.

4. СОДЕРЖАНИЕ И ЗНАНИЯ:
- Опирайся на факты из переписки (имена общих знакомых, места, локальные шутки).
- Если тебя спрашивают о чем-то, чего нет в переписке, придумай ответ, который был бы максимально органичен для этого персонажа.

5. ЗАПРЕЩЕНО:
- Запрещено использовать фразы вроде "Чем я могу помочь?", "Конечно, я отвечу", "Как ИИ, я...".
- Запрещено извиняться в стиле AI.
- Запрещено структурировать текст списками, если человек так не делает.

Твоя задача — чтобы собеседник не смог отличить твой ответ от ответа реального человека.

ФАЙЛ ПЕРЕПИСКИ:
${PERSONA_PLACEHOLDER}`;

        const STORAGE_PERSONA = 'ai_persona_text';
        const STORAGE_HISTORY = 'ai_history';
        const MAX_HISTORY_MESSAGES = 20;

        // ============================================================
        // Telegram Web App
        // ============================================================
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#17212b');
            tg.setBackgroundColor('#0e1621');
        }

        // ============================================================
        // Состояние
        // ============================================================
        let personaText = localStorage.getItem(STORAGE_PERSONA) || '';
        let history = [];
        let loading = false;

        try {
            history = JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '[]');
        } catch (e) {
            history = [];
        }

        // ============================================================
        // UI: экран загрузки / чат
        // ============================================================
        function showSetup() {
            document.getElementById('setupScreen').style.display = 'flex';
            document.getElementById('messagesArea').style.display = 'none';
            document.getElementById('inputBar').style.display = 'none';
            document.getElementById('typing').style.display = 'none';
            document.getElementById('chatStatus').textContent = 'загрузите файл индивидуальности';
            document.getElementById('chatName').textContent = 'AI Собеседник';
        }

        function showChat() {
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('messagesArea').style.display = 'flex';
            document.getElementById('inputBar').style.display = 'flex';
            document.getElementById('chatStatus').textContent = 'в сети';
            document.getElementById('chatName').textContent = 'AI Собеседник';

            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            if (history.length === 0) {
                addMessage('in', 'Привет! Я готов общаться 😊 Напиши мне что-нибудь.');
            }

            renderHistory();
            scrollToBottom();
            input.focus();
        }

        // ============================================================
        // Загрузка файла
        // ============================================================
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 1024 * 1024) {
                showToast('Файл слишком большой (макс. 1 МБ)');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                if (!text || text.trim().length < 10) {
                    showToast('Файл пустой или слишком короткий');
                    return;
                }
                personaText = text;
                localStorage.setItem(STORAGE_PERSONA, personaText);

                // Сбрасываем историю — новый персонаж
                history = [];
                localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history));

                showToast('✅ Файл загружен');
                showChat();
            };
            reader.onerror = function() {
                showToast('Не удалось прочитать файл');
            };
            reader.readAsText(file);

            e.target.value = '';
        });

        // ============================================================
        // Сообщения
        // ============================================================
        function addMessage(role, text) {
            const area = document.getElementById('messagesArea');
            const msg = document.createElement('div');
            msg.className = 'message ' + role;

            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            const ticks = role === 'out' ? '<span class="ticks">✓✓</span>' : '';

            msg.innerHTML = `
                <div class="bubble">
                    <span class="text"></span>
                    <span class="meta">
                        <span class="time">${time}</span>
                        ${ticks}
                    </span>
                </div>
            `;
            msg.querySelector('.text').textContent = text;
            area.appendChild(msg);
            scrollToBottom();
            return msg;
        }

        function renderHistory() {
            const area = document.getElementById('messagesArea');
            area.innerHTML = '';
            history.forEach(function(item) {
                addMessage(item.role === 'assistant' ? 'in' : 'out', item.content);
            });
        }

        function scrollToBottom() {
            const area = document.getElementById('messagesArea');
            area.scrollTop = area.scrollHeight;
        }

        // ============================================================
        // DeepSeek API
        // ============================================================
        function buildSystemPrompt() {
            return PROMPT.replace('${PERSONA_PLACEHOLDER}', personaText.slice(0, 15000));
        }

        function buildMessages() {
            const messages = [{ role: 'system', content: buildSystemPrompt() }];
            const lastMsgs = history.slice(-MAX_HISTORY_MESSAGES);
            lastMsgs.forEach(function(item) {
                messages.push({ role: item.role, content: item.content });
            });
            return messages;
        }

        async function callDeepSeek(messages, retry = 0) {
            const url = 'https://api.deepseek.com/chat/completions';
            const body = {
                model: DEEPSEEK_MODEL,
                messages: messages,
                stream: false
            };

            // Если прокси включён (retry = 1 или 2), оборачиваем URL
            const proxies = [
                'https://corsproxy.io/?url=',
                'https://api.allorigins.win/raw?url='
            ];

            let targetUrl = url;
            let headers = {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + DEEPSEEK_API_KEY
            };

            // Через прокси нельзя слать заголовок Authorization напрямую,
            // поэтому передаём его в теле (поддерживается corsproxy.io).
            if (retry > 0 && proxies[retry - 1]) {
                targetUrl = proxies[retry - 1] + encodeURIComponent(url);
                // AllOrigins не поддержит кастомные заголовки — вместо них
                // полагаемся на прямые заголовки, которые он отбрасывает.
                // В реальном продакшене нужен свой бэкенд.
            }

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 60000);

                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(body),
                    signal: controller.signal
                });
                clearTimeout(timeout);

                if (response.status === 200) {
                    const data = await response.json();
                    const text = data?.choices?.[0]?.message?.content;
                    return text ? text.trim() : 'Хм...';
                }

                if (response.status === 401) {
                    return '⚠️ Ошибка авторизации DeepSeek. Проверьте API-ключ.';
                }

                throw new Error('HTTP ' + response.status);
            } catch (err) {
                console.error('DeepSeek call failed:', err);

                // Пробуем следующий прокси
                if (retry < 2) {
                    return callDeepSeek(messages, retry + 1);
                }
                return '⚠️ Нет соединения с нейросетью. Попробуйте ещё раз.';
            }
        }

        // ============================================================
        // Отправка сообщения
        // ============================================================
        async function sendMessage() {
            if (loading) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            // Показываем сообщение пользователя
            addMessage('out', text);
            history.push({ role: 'user', content: text });
            localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history));

            input.value = '';
            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;
            loading = true;

            // Индикатор печати
            const typing = document.getElementById('typing');
            typing.style.display = 'flex';
            scrollToBottom();

            const messages = buildMessages();
            const reply = await callDeepSeek(messages);

            typing.style.display = 'none';
            addMessage('in', reply);
            history.push({ role: 'assistant', content: reply });
            localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history));

            input.disabled = false;
            document.getElementById('sendBtn').disabled = false;
            loading = false;
            input.focus();
        }

        // ============================================================
        // Сброс
        // ============================================================
        function resetChat() {
            if (loading) return;
            if (!confirm('Очистить файл индивидуальности и историю чата?')) return;

            personaText = '';
            history = [];
            localStorage.removeItem(STORAGE_PERSONA);
            localStorage.removeItem(STORAGE_HISTORY);
            showSetup();
            showToast('🗑️ Данные очищены');
        }

        // ============================================================
        // Тост
        // ============================================================
        let toastTimer;
        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 2200);
        }

        // ============================================================
        // Инициализация
        // ============================================================
        if (personaText) {
            showChat();
        } else {
            showSetup();
        }
    </script>

</body>
</html>
